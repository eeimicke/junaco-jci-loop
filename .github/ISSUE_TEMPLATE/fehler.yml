name: Dokumentationsfehler / Documentation error
description: Fehler oder Widerspruch melden / Report an error or contradiction
title: "[Fehler / Error]: "
labels: ["dokumentation"]
body:
  - type: input
    id: fundstelle
    attributes:
      label: Fundstelle / Location
      description: Datei, Kapitel oder Tabellenzeile / File, chapter, or table row
    validations:
      required: true
  - type: textarea
    id: fehler
    attributes:
      label: Beobachteter Fehler / Observed error
      description: Was ist falsch, unklar oder widersprüchlich? / What is incorrect, unclear, or contradictory?
    validations:
      required: true
  - type: textarea
    id: erwartung
    attributes:
      label: Erwartete Aussage / Expected statement
      description: Wie sollte die Aussage lauten? / How should the statement read?
    validations:
      required: true
  - type: textarea
    id: quellen
    attributes:
      label: Begründung oder Quellen / Rationale or sources
      description: Welche Modellstelle oder externe Quelle stützt die Meldung? / Which model section or external source supports the report?
    validations:
      required: false
