name: Repository prüfen / Validate repository

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken / Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Pflichtdateien und unerwünschte Dateien prüfen / Check required and unwanted files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "docs/JCI_CONTEXT.md"
            "LICENSE.md"
            "NOTICE.md"
            "README.md"
            "CONTRIBUTING.md"
            "GOVERNANCE.md"
            "AGENTS.md"
            ".github/CODEOWNERS"
          )

          for file in "${required[@]}"; do
            test -s "$file" || { echo "Pflichtdatei fehlt oder ist leer / Required file is missing or empty: $file"; exit 1; }
          done

          if find . -type f \( -name '.env' -o -name '.env.*' \) -not -path './.git/*' | grep -q .; then
            echo "Eine nicht zulässige .env-Datei wurde gefunden / A prohibited .env file was found."
            exit 1
          fi

          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' . --exclude-dir=.git; then
            echo "Nicht aufgelöste Konfliktmarker wurden gefunden / Unresolved conflict markers were found."
            exit 1
          fi

          oversized="$(find . -type f -not -path './.git/*' -size +5M -print)"
          if test -n "$oversized"; then
            echo "Dateien über 5 MB sind nicht ohne ausdrückliche Prüfung zulässig / Files over 5 MB require explicit review:"
            echo "$oversized"
            exit 1
          fi

      - name: Prüfabhängigkeiten installieren / Install validation dependencies
        shell: bash
        run: python3 -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: JCI-Modellregeln und Dokumentkonsistenz prüfen / Validate JCI model rules and document consistency
        shell: bash
        run: python3 -m unittest discover -s tests -v

      - name: Pull-Request-Beschreibung prüfen / Validate pull request description
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          test -n "${PR_BODY//[[:space:]]/}" || {
            echo "Die Pull-Request-Beschreibung darf nicht leer sein / The pull request description must not be empty."
            exit 1
          }
          grep -Fq "## Anlass und Ziel" <<< "$PR_BODY" || {
            echo "Der Abschnitt 'Anlass und Ziel' fehlt / The section 'Reason and objective' is missing."
            exit 1
          }
          grep -Fq "## Modellprüfung" <<< "$PR_BODY" || {
            echo "Der Abschnitt 'Modellprüfung' fehlt / The section 'Model review' is missing."
            exit 1
          }
          grep -Fq "## Rechte und Quellen" <<< "$PR_BODY" || {
            echo "Der Abschnitt 'Rechte und Quellen' fehlt / The section 'Rights and sources' is missing."
            exit 1
          }

  neo4j-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      neo4j:
        image: neo4j:2026.08.1
        env:
          NEO4J_AUTH: none
          NEO4J_server_http_enabled: "false"
          NEO4J_server_https_enabled: "false"
          NEO4J_server_memory_heap_initial__size: 256m
          NEO4J_server_memory_heap_max__size: 512m
          NEO4J_server_memory_pagecache_size: 128m
        ports:
          - "127.0.0.1:7687:7687"
        options: >-
          --health-cmd "cypher-shell -a bolt://localhost:7687 'RETURN 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-start-period 30s
          --health-retries 24
    steps:
      - name: Repository auschecken / Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Laufzeitabhängigkeiten installieren / Install runtime dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-runtime.txt
      - name: Echte Neo4j-Transaktionen prüfen / Test real Neo4j transactions
        env:
          JCI_NEO4J_TEST_URI: bolt://127.0.0.1:7687
          JCI_NEO4J_TEST_DATABASE: neo4j
          JCI_NEO4J_TEST_CONFIRM: isolated
        run: python3 -B -m unittest discover -s tests/integration -v

