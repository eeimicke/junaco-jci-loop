name: Repository prüfen

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Pflichtdateien und unerwünschte Dateien prüfen
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "docs/JCI_CONTEXT.md"
            "LICENSE.md"
            "NOTICE.md"
            "README.md"
            "CONTRIBUTING.md"
            "GOVERNANCE.md"
            "AGENTS.md"
            ".github/CODEOWNERS"
          )

          for file in "${required[@]}"; do
            test -s "$file" || { echo "Pflichtdatei fehlt oder ist leer: $file"; exit 1; }
          done

          if find . -type f \( -name '.env' -o -name '.env.*' \) -not -path './.git/*' | grep -q .; then
            echo "Eine nicht zulässige .env-Datei wurde gefunden."
            exit 1
          fi

          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' . --exclude-dir=.git; then
            echo "Nicht aufgelöste Konfliktmarker wurden gefunden."
            exit 1
          fi

          oversized="$(find . -type f -not -path './.git/*' -size +5M -print)"
          if test -n "$oversized"; then
            echo "Dateien über 5 MB sind nicht ohne ausdrückliche Prüfung zulässig:"
            echo "$oversized"
            exit 1
          fi

      - name: Pull-Request-Beschreibung prüfen
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          test -n "${PR_BODY//[[:space:]]/}" || {
            echo "Die Pull-Request-Beschreibung darf nicht leer sein."
            exit 1
          }
          grep -Fq "## Anlass und Ziel" <<< "$PR_BODY" || {
            echo "Der Abschnitt 'Anlass und Ziel' fehlt."
            exit 1
          }
          grep -Fq "## Modellprüfung" <<< "$PR_BODY" || {
            echo "Der Abschnitt 'Modellprüfung' fehlt."
            exit 1
          }
          grep -Fq "## Rechte und Quellen" <<< "$PR_BODY" || {
            echo "Der Abschnitt 'Rechte und Quellen' fehlt."
            exit 1
          }

