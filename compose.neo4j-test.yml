# Isolated disposable tests only. No production volumes or credentials.
# Official Community tag: https://neo4j.com/docs/operations-manual/current/docker/introduction/
name: jci-runtime-tests
services:
  neo4j:
    image: neo4j:2026.08.1
    ports:
      - "127.0.0.1:17687:7687"
    environment:
      NEO4J_AUTH: none
      NEO4J_server_http_enabled: "false"
      NEO4J_server_https_enabled: "false"
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:7687 'RETURN 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 24
